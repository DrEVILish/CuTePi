{{ define "showModal.html" }}
<div class="modal fade" id="showModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5">Import .CTP show</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form
        hx-post="/api/show/import"
        hx-encoding="multipart/form-data"
        hx-swap="none"
      >
        <div class="modal-body">
          <label class="form-label" for="showFile">Choose a .CTP file</label>
          <input class="form-control" type="file" id="showFile" name="file" accept=".ctp,application/zip" required />
          <div class="ftl-field-hint ftl-text-muted">A show archive exported from CuTePi (media + cues + settings + audit trail).</div>

          <label class="ftl-label ftl-mt-m" for="showMode">Import mode</label>
          <select class="form-select" id="showMode" name="mode">
            <option value="append">Append to end of current cuesheet</option>
            <option value="overwrite">Overwrite current cuesheet</option>
          </select>
          <div class="ftl-field-hint ftl-text-muted">Overwrite clears the current cuesheet. Media is added to the pool in both modes.</div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn ftl-btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn ftl-btn-primary">Import</button>
        </div>
      </form>
    </div>
  </div>
</div>
{{ end }}
