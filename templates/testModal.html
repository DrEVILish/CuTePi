{{ define "testModal.html" }}

<div class="modal fade" id="testModal" tabindex="-1" aria-labelledby="testModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="testModalLabel">Show Test</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div id="test-pattern-grid" class="d-flex is-wrap is-gap-xs ftl-mb-xs" aria-label="Built-in test patterns"></div>
        <div id="test-custom-grid" class="d-flex is-wrap is-gap-xs" aria-label="Custom test patterns"></div>
        <p class="ftl-text-muted small ftl-mt-xs mb-0">Pin your own media from its tile menu ("Add to test patterns").</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn ftl-btn-secondary" data-bs-dismiss="modal">Keep</button>
        <button
          type="button"
          class="btn ftl-btn-danger"
          id="testHideBtn"
          hx-post="/api/stop"
          hx-swap="none"
        >
          Hide Test
        </button>
      </div>
    </div>
  </div>
</div>

<script>
  var testPatternsLoaded = false;
  document.addEventListener("click", function (e) {
    var btn = e.target.closest("[data-test-open]");
    if (!btn) return;
    // Opening Tests shows the picker; it does NOT auto-play SMPTE (the
    // transport's TV button still fires the default pattern directly).
    bootstrap.Modal.getOrCreateInstance(document.getElementById("testModal")).show();
    if (!testPatternsLoaded) {
      testPatternsLoaded = true;
      var grid = document.getElementById("test-pattern-grid");
      var custom = document.getElementById("test-custom-grid");
      fetch("/api/testpatterns").then(function (r) { return r.json(); }).then(function (data) {
        data.builtin.forEach(function (p) {
          var b = document.createElement("button");
          b.type = "button"; b.className = "btn ftl-btn-sm ftl-btn-secondary";
          b.textContent = p.label;
          b.onclick = function () {
            htmx.ajax("POST", "/api/test/" + encodeURIComponent(p.name), {swap: "none"});
          };
          grid.appendChild(b);
        });
        (data.custom || []).forEach(function (name) {
          var b = document.createElement("button");
          b.type = "button"; b.className = "btn ftl-btn-sm ftl-btn-secondary";
          b.textContent = name;
          b.title = "Play this media as a test pattern";
          b.onclick = function () {
            htmx.ajax("POST", "/api/play/" + encodeURIComponent(name), {swap: "none"});
          };
          custom.appendChild(b);
        });
        if (!(data.custom || []).length) custom.hidden = true;
      });
    }
  });
</script>

{{ end }}
