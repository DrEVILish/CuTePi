{{ define "groupinspector.html" }}
<!-- Same wrapper id as the cue inspector: the auto-refresh logic refetches
     GET /api/cue/inspector into #cueinspector-body, so rendering a group
     here must still present that id or every later cue re-render dies. -->
<div id="cueinspector-body" class="groupinspector-body" data-group-id="{{ .Group.GroupID }}">
  <div class="d-flex justify-content-between align-items-center mb-2">
    <h6 class="mb-0"><i class="bi {{ if .Group.Slideshow }}bi-images{{ else }}bi-folder-fill{{ end }} me-1"></i>Group</h6>
    <span class="text-muted small">{{ .MemberCount }} cue{{ if ne .MemberCount 1 }}s{{ end }}</span>
  </div>

  {{ if .Group.Slideshow }}
  <div class="alert alert-info py-2 px-3 small">
    <i class="bi bi-play-circle me-1"></i>
    Slideshow: its cues cycle automatically with the settings below. Press <em>Play</em> on the sheet to start it.
  </div>
  {{ end }}

  <form hx-put="/api/group/{{ .Group.GroupID }}" hx-target="#cuesheet" hx-swap="outerHTML"
    class="gi-form vstack gap-2" style="max-width: 42rem;">
    <div class="d-flex gap-2">
      <div class="flex-grow-1">
        <label class="form-label small mb-0" for="group-name">Name</label>
        <input id="group-name" name="name" class="form-control form-control-sm" value="{{ .Group.Name }}">
      </div>
      <div>
        <label class="form-label small mb-0" for="group-cuenum">Number</label>
        <input id="group-cuenum" name="cueNum" class="form-control form-control-sm" style="width:6em" maxlength="24"
          value="{{ .Group.CueNum }}">
      </div>
    </div>
    <div class="row g-2">
      <div class="col">
        <label class="form-label small mb-1" for="group-swatches">Colour</label>
        <div class="insp-swatches" id="group-swatches" role="radiogroup" aria-label="Group colour">
          <label class="insp-swatch insp-swatch-none" title="None">
            <input type="radio" name="color" value="" aria-label="No colour" {{ if not $.Group.Color }}checked{{ end }}>
            <span class="insp-swatch-fill"></span>
          </label>
          {{ range .Palette }}
          <label class="insp-swatch" style="--swatch: {{ .Hex }}" title="{{ .Name }}">
            <input type="radio" name="color" value="{{ .Hex }}" aria-label="{{ .Name }}" {{ if eq $.Group.Color .Hex }}checked{{ end }}>
            <span class="insp-swatch-fill"></span>
          </label>
          {{ end }}
        </div>
      </div>
      <div class="col-auto align-self-end">
        <label class="form-label small mb-1 d-block" for="group-parent" style="visibility:hidden">.</label>
        <select id="group-parent" name="parentGroupID" class="form-select form-select-sm" aria-label="Parent group" title="Nest this group inside another">
          <option value="0" {{ if not .Group.ParentGroupID }}selected{{ end }}>Top level</option>
          {{ range .OtherGroups }}
          {{ if ne .GroupID $.Group.GroupID }}
          <option value="{{ .GroupID }}" {{ if eq $.Group.ParentGroupID .GroupID }}selected{{ end }}{{ if .IsDescendantOf }}disabled{{ end }}>{{ .Indent }}{{ .Name }}</option>
          {{ end }}
          {{ end }}
        </select>
      </div>
    </div>
    <div class="d-flex flex-wrap gap-2">
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="checkbox" id="group-slideshow" name="slideshow" value="true" {{ if .Group.Slideshow }}checked{{ end }}>
        <label class="form-check-label small" for="group-slideshow">Slideshow</label>
      </div>
      <div class="form-check form-check-inline" id="group-slideshow-opts">
        <input class="form-check-input" type="checkbox" id="group-shuffle" name="shuffle" value="true" {{ if .Group.Shuffle }}checked{{ end }} {{ if not .Group.Slideshow }}disabled{{ end }}>
        <label class="form-check-label small" for="group-shuffle">Shuffle</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="checkbox" id="group-loop" name="loop" value="true" {{ if .Group.Loop }}checked{{ end }} {{ if not .Group.Slideshow }}disabled{{ end }}>
        <label class="form-check-label small" for="group-loop">Loop</label>
      </div>
    </div>
    <div class="d-flex gap-2 {{ if not .Group.Slideshow }}row-disabled{{ end }}" id="group-slideshow-timings">
      <div>
        <label class="form-label small mb-0" for="group-duration">Hold each image (s)</label>
        <input id="group-duration" name="durationSecs" type="number" min="0" step="1" class="form-control form-control-sm" style="width:8em"
          value="{{ if .Group.DurationMS }}{{ div .Group.DurationMS 1000 }}{{ end }}" placeholder="5">
      </div>
      <div>
        <label class="form-label small mb-0" for="group-fade">Fade between (s)</label>
        <input id="group-fade" name="fadeSecs" type="number" min="0" step="1" class="form-control form-control-sm" style="width:8em"
          value="{{ if .Group.FadeMS }}{{ div .Group.FadeMS 1000 }}{{ end }}" placeholder="0">
      </div>
    </div>
    <div class="d-flex justify-content-between align-items-center">
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="group-collapse" name="collapse" value="true" {{ if .Group.Collapse }}checked{{ end }}>
        <label class="form-check-label small" for="group-collapse">Collapsed</label>
      </div>
      <button class="btn btn-sm btn-primary" type="submit">Save</button>
    </div>
  </form>

  <script>
    (function () {
      var box = document.querySelector(".groupinspector-body[data-group-id='{{ .Group.GroupID }}']");
      if (!box) return;
      var slideshow = box.querySelector("#group-slideshow");
      function syncOpts() {
        var on = slideshow.checked;
        box.querySelectorAll("#group-shuffle, #group-loop").forEach(function (el) {
          el.disabled = !on;
        });
        var timings = box.querySelector("#group-slideshow-timings");
        if (timings) timings.classList.toggle("row-disabled", !on);
        box.querySelectorAll("#group-slideshow-timings input").forEach(function (el) { el.disabled = !on; });
      }
      slideshow.addEventListener("change", syncOpts);
      syncOpts();
    })();
  </script>
</div>
{{ end }}
