{{ define "header.html" }}
<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ .title }} Control Centre - CuTePi</title>

    <!-- Bootstrap loads FIRST as a utility fallback: every app layer below
      wins its conflicts, so themes never depend on Bootstrap specifics and
      it can keep shrinking toward removal. Icons stay last (font only). -->
    <link rel="stylesheet" href="/css/bootstrap@5.3.3.css?v={{ assetStamp }}">
    <link rel="stylesheet" href="/css/index.css?v={{ assetStamp }}">
    <link rel="stylesheet" href="/css/comp/dropzone.css?v={{ assetStamp }}">
    <link rel="stylesheet" href="/css/comp/cuesheet.css?v={{ assetStamp }}">
    <link rel="stylesheet" href="/css/comp/mediapool.css?v={{ assetStamp }}">
    <link rel="stylesheet" href="/css/comp/layout.css?v={{ assetStamp }}">
    <link rel="stylesheet" href="/css/comp/themes.css?v={{ assetStamp }}">
    <!-- One portable file per theme: dropping name.css into public/css/themes
      auto-links it here and offers it in Settings (routes.Themes). -->
    {{ range themeFiles }}<link rel="stylesheet" href="/css/themes/{{ .File }}?v={{ assetStamp }}">
    {{ end }}<link rel="stylesheet" href="/css/bootstrap-icons@1.11.3.css?v={{ assetStamp }}">
    <script>
      (function () {
        var available = [{{ range $i, $t := themeFiles }}{{ if $i }}, {{ end }}"{{ $t.Name }}"{{ end }}, "custom"];
        var theme = "blue-future";
        try { theme = localStorage.getItem("cutepi.theme") || theme; } catch (_) {}
        if (available.indexOf(theme) === -1) theme = "blue-future";
        document.documentElement.dataset.theme = theme;
        if (theme === "custom") {
          try {
            var tokens = JSON.parse(localStorage.getItem("cutepi.customTheme"));
            if (tokens && typeof tokens === "object") {
              var decls = Object.keys(tokens).map(function (k) { return "  " + k + ": " + tokens[k] + ";"; }).join("\n");
              var css = document.createElement("style");
              css.id = "cutepi-custom-theme";
              css.textContent = ":root[data-theme=custom] {\n" + decls + "\n}";
              document.head.appendChild(css);
            }
          } catch (e) {}
        }
      }());
    </script>
  </head>
{{ end }}
