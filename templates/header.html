{{ define "header.html" }}
<!DOCTYPE html>
<html data-bs-theme="dark">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ .title }} Control Centre - CuTePi</title>

    <!-- Bootstrap loads FIRST as a utility fallback: every app layer below
      wins its conflicts, so themes never depend on Bootstrap specifics and
      it can keep shrinking toward removal. Icons stay last (font only). -->
    <link rel="stylesheet" href="/css/bootstrap@5.3.3.css?v={{ assetStamp }}">
    <link rel="stylesheet" href="/css/index.css?v={{ assetStamp }}">
    <link rel="stylesheet" href="/css/comp/dropzone.css?v={{ assetStamp }}">
    <link rel="stylesheet" href="/css/comp/cuesheet.css?v={{ assetStamp }}">
    <link rel="stylesheet" href="/css/comp/mediapool.css?v={{ assetStamp }}">
    <link rel="stylesheet" href="/css/comp/layout.css?v={{ assetStamp }}">
    <link rel="stylesheet" href="/css/comp/themes.css?v={{ assetStamp }}">
    <!-- Exactly ONE theme stylesheet is linked, chosen before first paint by
      the script below. Previously every theme file was linked at once and
      html[data-theme] picked the winner; that cannot work now that an app
      theme and a shared ftl-themes theme can have the same data-theme name
      (both have "blue-future"), and loading one file at a time is what the
      ftl-themes contract requires in any case. Dropping a name.css into
      public/css/themes still auto-discovers it (routes.Themes). -->
    <link id="cutepi-theme-css" rel="stylesheet">
    <link rel="stylesheet" href="/css/bootstrap-icons@1.11.3.css?v={{ assetStamp }}">
    <script>
      (function () {
        var THEMES = {{ themeMap }};
        var DEFAULT_ID = "{{ defaultThemeID }}";
        var stamp = "?v={{ assetStamp }}";
        var id = DEFAULT_ID;
        try { id = localStorage.getItem("cutepi.theme") || DEFAULT_ID; } catch (_) {}
        // ?theme=<id> previews a theme for this page view only — never saved,
        // so the picker's stored preference keeps controlling normal loads.
        try {
          var qs = new URLSearchParams(location.search).get("theme");
          if (qs && THEMES[qs]) id = qs;
        } catch (_) {}
        // Preferences saved before themes were shared hold a bare name
        // ("lcars"); those have always meant an app-owned file with that name,
        // so they
        // migrate to the app: namespace rather than silently switching the
        // user to the shared theme of the same name.
        if (id.indexOf(":") === -1) id = "app:" + id;
        if (!THEMES[id]) id = DEFAULT_ID;
        var theme = THEMES[id].name;
        // Bootstrap's dark/light variables must follow the theme: a light
        // shared theme (aqua, windows95) renders light surfaces, and dark-mode
        // text would sit invisible on them (empty selects, unreadable help).
        document.documentElement.dataset.bsTheme =
          (THEMES[id] && THEMES[id].scheme) || "dark";
        var link = document.getElementById("cutepi-theme-css");
        if (link) link.href = THEMES[id].href + stamp;
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.themeId = id;
      }());
    </script>
  </head>
{{ end }}
