{{ define "logsModal.html" }}
<div class="app-modal fade" id="logsModal" tabindex="-1" aria-labelledby="logsModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content modal">
      <div class="modal-header">
        <span class="modal-title" id="logsModalLabel">Logs</span>
        <div class="segmented" role="group" aria-label="Log level">
          <button type="button" class="segmented-item logs-level" data-level="debug">Debug</button>
          <button type="button" class="segmented-item logs-level" data-level="info">Info</button>
          <button type="button" class="segmented-item logs-level" data-level="warn">Warning</button>
        </div>
        <button type="button" class="btn btn-sm btn-secondary btn-icon" id="logs-clear" title="Clear the buffered log viewer records" aria-label="Clear buffered logs"><svg class="icon"><use href="/ftl/assets/icons/icons.svg#icon-trash"/></svg></button>
        <button type="button" class="btn btn-sm btn-secondary btn-icon" id="logs-refresh" title="Refresh logs" aria-label="Refresh logs"><svg class="icon"><use href="/ftl/assets/icons/icons.svg#icon-refresh"/></svg></button>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="log logs-feed" id="logs-feed" role="log" aria-label="Server log" tabindex="0"></div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  const feed = document.getElementById("logs-feed");
  function refreshLogs() {
    fetch("/api/logs")
      .then(r => r.json())
      .then(data => {
        const levelBtn = document.querySelector(".logs-level[data-level='" + data.level + "']");
        document.querySelectorAll(".logs-level").forEach(b => {
          b.classList.toggle("is-active", b === levelBtn);
          b.setAttribute("aria-pressed", b === levelBtn ? "true" : "false");
        });
        // Stock .log: one .log-line per record, coloured by data-level.
        feed.replaceChildren(...(data.entries.length ? data.entries : [{ time: "", level: "info", code: "", message: "(no buffered logs)" }]).map(e => {
          const line = document.createElement("div"), time = document.createElement("span");
          line.className = "log-line";
          line.dataset.level = /^warn/i.test(e.level) ? "warn" : e.level.toLowerCase();
          time.className = "log-time";
          time.textContent = e.time.replace("T", " ").slice(0, 19);
          line.append(time, (e.code ? "[" + e.code + "] " : "") + e.message + (e.audit ? "  <audit>" : ""));
          return line;
        }));
        feed.scrollTop = feed.scrollHeight;
      })
      .catch(() => { feed.textContent = "failed to fetch /api/logs"; });
  }
  document.getElementById("logsModal").addEventListener("shown.bs.modal", refreshLogs);
  document.getElementById("logs-refresh").addEventListener("click", refreshLogs);
  document.getElementById("logs-clear").addEventListener("click", () => {
    fetch("/api/logs", { method: "DELETE" }).then(refreshLogs);
  });
  document.querySelectorAll(".logs-level").forEach(b => {
    b.addEventListener("click", () => {
      const body = new URLSearchParams({ level: b.dataset.level });
      fetch("/api/logs/level", { method: "POST", body }).then(refreshLogs);
    });
  });
})();
</script>
{{ end }}
