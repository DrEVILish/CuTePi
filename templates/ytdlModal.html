{{ define "ytdlModal.html" }}

<div class="app-modal fade" id="ytdlModal" tabindex="-1" aria-labelledby="ytdlModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content modal">
      <div class="modal-header">
        <span class="modal-title" id="ytdlModalLabel">Download from URL</span>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form
        id="youtube-dl"
        action="/youtube"
        method="post"
      >
        <div class="modal-body">
          <div class="field">
          <label class="label" for="url">Video URL</label>
          <input
            class="input"
            id="url"
            type="url"
            name="url"
            required
            autocomplete="url"
            placeholder="https://www.youtube.com/watch?v=dQw4w9WgXcQ"
          />
          </div>

          <div id="ytdl-status" class="d-none mt-m">
            <div class="field-hint" id="ytdl-stage" role="status" aria-live="polite">Preparing&hellip;</div>
            <div class="progress">
              <div class="progress-bar" id="ytdl-progress" role="progressbar" aria-label="Download progress" style="width: 0%"></div>
            </div>
            <div class="field-hint row is-justify-between">
              <span id="ytdl-percent">0%</span>
              <span id="ytdl-speed"></span>
              <span id="ytdl-eta"></span>
            </div>
          </div>

          <div id="ytdl-rename" class="d-none mt-m">
            <label class="label" for="ytdl-rename-input">Seen and imported &mdash; rename the file if you like</label>
            <div class="input-group">
              <input class="input" id="ytdl-rename-input" name="name" type="text"
                autocomplete="off" spellcheck="false">
              <button class="btn btn-secondary" type="button" id="ytdl-rename-btn">Rename</button>
            </div>
          </div>

          <div id="ytdl-error" class="field-error d-none" role="alert"></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-primary" id="download" type="submit">Download</button>
        </div>
      </form>
    </div>
  </div>
</div>

{{ end }}
