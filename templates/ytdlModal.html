{{ define "ytdlModal.html" }}

<div class="modal fade" id="ytdlModal" tabindex="-1" aria-labelledby="ytdlModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="ytdlModalLabel">YouTube Downloader</h1>
        <a class="btn btn-lg" href="/upload">
          <i class="bi bi-box-arrow-right"></i>
        </a>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form
        id="youtube-dl"
        action="/youtube"
        method="post"
      >
        <div class="modal-body">
          <label class="form-label" for="url">YouTube URL&nbsp;</label>
          <input
            class="form-control"
            id="url"
            type="url"
            name="url"
            required
            autocomplete="url"
            placeholder="https://www.youtube.com/watch?v=dQw4w9WgXcQ"
          />

          <div id="ytdl-status" class="d-none mt-3">
            <div class="small text-muted mb-1" id="ytdl-stage" role="status" aria-live="polite">Preparing&hellip;</div>
            <div class="progress ytdl-progress" style="height: 0.6rem;">
              <div class="progress-bar" id="ytdl-progress" role="progressbar" style="width: 0%"></div>
            </div>
            <div class="small text-muted mt-1 d-flex justify-content-between ytdl-stats">
              <span id="ytdl-percent">0%</span>
              <span id="ytdl-speed"></span>
              <span id="ytdl-eta"></span>
            </div>
          </div>

          <div id="ytdl-rename" class="d-none mt-3">
            <label class="form-label" for="ytdl-rename-input">Seen and imported &mdash; rename the file if you like</label>
            <div class="d-flex gap-2">
              <input class="form-control" id="ytdl-rename-input" name="name" type="text"
                autocomplete="off" spellcheck="false" aria-label="New file name">
              <button class="btn btn-outline-primary flex-shrink-0" type="button" id="ytdl-rename-btn">Rename</button>
            </div>
          </div>

          <div id="ytdl-error" class="small text-danger mt-2 d-none" role="alert"></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-danger" id="download" type="submit">Download</button>
        </div>
      </form>
    </div>
  </div>
</div>

{{ end }}
