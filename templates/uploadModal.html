{{ define "uploadModal.html" }}

<div class="app-modal fade" id="uploadModal" tabindex="-1" aria-labelledby="uploadModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-xl">
    <div class="modal-content modal">
      <div class="modal-header">
        <span class="modal-title" id="uploadModalLabel">Upload</span>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form id="dropform">
        <div class="modal-body">
          <div id="dropzone" class="dropzone">
            <input
              id="file-input"
              type="file"
              name="media"
              multiple
              hidden
            />
            <label for="file-input">
              <svg class="icon"><use href="/ftl/assets/icons/icons.svg#icon-cloud-upload"/></svg>
              <strong>Choose files</strong>
              <span class="dragndrop"> or drag them here</span>
            </label>
          </div>
          <ul id="filelist"></ul>
          <progress id="progress" class="progress" value="0" max="100" aria-label="Upload progress" hidden></progress>
          <div id="upload-status" role="status" aria-live="polite"></div>
        </div>
        <div class="modal-footer">
          <a class="btn btn-ghost" href="/upload">Open the upload page</a>
          <button id="upload" class="btn btn-primary" type="submit">Upload</button>
        </div>
      </form>
    </div>
  </div>
</div>
<script src="/src/dropzone.js?v={{ assetStamp }}"></script>

{{ end }}
