{{ define "mediainfo.html" }}

<!-- Merged header status (§5.2): GO cluster + Now Playing in one
     version-guarded partial — every render keeps both truthful. -->
<div id="mediainfo" class="header-status">
  <div class="go-cluster ftl-row is-items-center is-gap-xs">
    <button type="button" id="go-btn" class="btn btn-go"
      hx-post="/api/cue/selected/play" hx-target="#cuesheet" hx-swap="outerHTML"
      title="Fire the selected cue (Space / Enter)" aria-label="GO">
      GO<svg class="ftl-icon"><use href="/ftl/assets/icons/icons.svg#icon-play"/></svg>
    </button>
    <div class="go-now" {{ if not .GoHasSel }}hidden{{ end }}{{ if .GoColor }} style="border-color: {{ .GoColor }}"{{ end }}>
      <span class="go-num">{{ if .GoNum }}{{ .GoNum }}{{ else }}&mdash;{{ end }}</span>
      <span class="go-sep" aria-hidden="true">&middot;</span>
      <span class="go-title" title="{{ .GoTitle }}">{{ .GoTitle }}</span>
    </div>
  </div>

  <div class="now-cluster text-center mx-auto">
    {{ if .Filename }}
    <div class="now-title">
      <span class="ftl-text-muted small">NOW&nbsp;</span>
      {{ if .PlayingCueNum }}<span class="go-num">{{ .PlayingCueNum }}</span>{{ end }}
      <span title="{{ .PlayingCueTitle }}">{{ .PlayingCueTitle }}</span>
    </div>
    <div class="ftl-row is-items-center is-gap-xs mt-1">
      <button type="button" class="btn ftl-btn-sm ftl-btn-secondary" hx-post="/api/togglePause" hx-swap="none"
        title="Pause / resume" aria-label="Pause or resume">
        <svg class="ftl-icon"><use href="/ftl/assets/icons/icons.svg#icon-pause"/></svg>
      </button>
      <input type="range" class="ctp-slider ctp-scrubber flex-grow-1"
        id="nowplaying-scrubber" value="{{ .PositionRaw }}" min="0" max="{{ .DurationRaw }}" step="0.05"
        aria-label="Seek within the clip">
      <small class="text-nowrap" id="now-time" title="{{ .Duration }} total">{{ .Position }} / -<span id="now-remaining" class="remaining-slow">{{ .Remaining }}</span></small>
    </div>
    {{ else }}
    <small class="text-muted">Nothing playing</small>
    {{ end }}
  </div>
</div>

<script>
  (function () {
    var root = document.getElementById("nowplaying-scrubber");
    if (!root) return;

    var remEl = document.getElementById("now-remaining");
    var timeEl = document.getElementById("now-time");
    var duration = parseFloat(root.max) || 0;

    function post(url, data) {
      fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded", "HX-Request": "true" },
        body: data,
      });
    }

    // Pulse the remaining time indicator based on time left.
    var pulseTimer = setInterval(function () {
      if (!remEl || !timeEl) return;
      var pos = parseFloat(root.value) || 0;
      var remSec = Math.max(0, duration - pos);
      // Update the text (mm:ss)
      var m = Math.floor(remSec / 60);
      var s = Math.floor(remSec % 60);
      remEl.textContent = (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
      // Pulse classes
      if (remSec <= 10 && remSec > 0) {
        remEl.classList.add("remaining-fast");
        remEl.classList.remove("remaining-slow");
      } else if (remSec <= 30 && remSec > 0) {
        remEl.classList.add("remaining-slow");
        remEl.classList.remove("remaining-fast");
      } else {
        remEl.classList.remove("remaining-slow", "remaining-fast");
      }
    }, 500);

    var scrubTimer = null;
    root.addEventListener("input", function () {
      var pos = parseFloat(root.value) || 0;
      clearTimeout(scrubTimer);
      scrubTimer = setTimeout(function () {
        post("/api/seek", "position=" + pos);
      }, 120);
    });

    // Cleanup on htmx swap
    document.body.addEventListener("htmx:beforeSwap", function (e) {
      if (e.detail.target?.id === "mediainfo") {
        clearInterval(pulseTimer);
      }
    });
  })();
</script>

{{ end }}
