{{ define "upload.html" }}

{{ template "header.html" }}

<body class="app-body upload-body">
  <div class="app">
  <header class="app-bar">
    <a class="nav-brand" href="/" aria-label="CuTePi control centre">
      <img class="cutepi-logo" src="/img/cutepi-logo.svg" alt="CuTePi">
    </a>
    <a class="btn btn-ghost app-status-end" href="/">
      <svg class="icon"><use href="/ftl/assets/icons/icons.svg#icon-arrow-left"/></svg>&nbsp;Control centre
    </a>
  </header>

  <main class="app-main upload-container">
    <div class="card">
        <h1 class="panel-header">Add media</h1>
        <form
          id="dropform"
          action="/upload"
          method="post"
          enctype="multipart/form-data"
        >
          <div id="dropzone" class="dropzone">
            <input
              id="file-input"
              type="file"
              name="media"
              multiple
              hidden
            />
            <label for="file-input">
              <svg class="icon"><use href="/ftl/assets/icons/icons.svg#icon-cloud-upload"/></svg>
              <strong>Choose files</strong>
              <span class="dragndrop"> or drag them here</span>
            </label>
          </div>
          <ul id="filelist"></ul>
          <progress id="progress" class="progress" value="0" max="100" aria-label="Upload progress" hidden></progress>
          <div id="upload-status" role="status" aria-live="polite"></div>
          <div class="modal-footer">
            <button id="upload" type="submit" class="btn btn-primary">Upload</button>
          </div>
        </form>
    </div>
  </main>
  </div>

  <script src="/src/dropzone.js?v={{ assetStamp }}"></script>
{{ template "footer.html" }}

{{ end }}
