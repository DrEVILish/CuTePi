{{ define "upload.html" }}

{{ template "header.html" }}

<body class="app-body upload-body">
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid d-flex is-justify-between is-items-center">
      <a class="navbar-brand mb-0" href="/" aria-label="CuTePi control centre">
        <img class="cutepi-logo" src="/img/cutepi-logo.svg" alt="CuTePi">
        <span class="ftl-text-muted fs-6">Upload</span>
      </a>
      <a class="btn ftl-btn-ghost" href="/" title="Open the control centre" aria-label="Open the control centre">
        <svg class="ftl-icon -eye-fill"><use href="/ftl/assets/icons/icons.svg#icon-eye"/></svg>&nbsp;Control centre
      </a>
    </div>
  </nav>

  <div class="container py-4 upload-container">
    <div class="card bg-dark border-secondary">
      <div class="card-body">
        <h2 class="h5 ftl-mb-m">Add media</h2>
        <form
          id="dropform"
          action="/upload"
          method="post"
          enctype="multipart/form-data"
        >
          <div id="dropzone">
            <input
              id="file-input"
              type="file"
              name="media"
              multiple
              hidden
            />
            <label for="file-input">
              <strong>Choose a file</strong>
              <span class="dragndrop"> or drag it here</span>
            </label>
          </div>
          <ul id="filelist"></ul>
          <progress id="progress" value="0" max="100"></progress>
          <div class="d-flex is-justify-end ftl-mt-m">
            <button id="upload" type="submit" class="btn ftl-btn-primary btn-lg w-100">Upload</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="/src/dropzone.js"></script>
{{ template "footer.html" }}

{{ end }}
