{{ define "mediacontrols.html" }}

<div id="esc" hx-trigger="esc" hx-post="/api/esc" hx-swap="none" style="display: none;"></div>
<div id="panichard" hx-trigger="panichard" hx-post="/api/panic" hx-swap="none" style="display: none;"></div>
<div class="d-flex is-gap-xs">
  <div class="btn-group">
    <button class="btn btn-sm btn-danger dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false" title="Menu" aria-label="Menu"><svg class="icon"><use href="/ftl/assets/icons/icons.svg#icon-menu"/></svg></button>
     <ul class="dropdown-menu dropdown-menu-end">
      <li>
        <button class="dropdown-item" hx-post="/api/panic" hx-swap="none" hx-confirm="PANIC: cut playback now?" type="button">
          <svg class="icon"><use href="/ftl/assets/icons/icons.svg#icon-warning"/></svg>&nbsp;Panic
        </button>
      </li>
      <li>
        <button class="dropdown-item" hx-post="/api/stop" hx-swap="none" type="button">
          <svg class="icon"><use href="/ftl/assets/icons/icons.svg#icon-stop"/></svg>&nbsp;Stop
        </button>
      </li>
      <li>
        <button class="dropdown-item" hx-post="/api/fadeOut" hx-swap="none" type="button">
          <svg class="icon"><use href="/ftl/assets/icons/icons.svg#icon-sun-low"/></svg>&nbsp;Fade out
        </button>
      </li>
      <li><hr class="dropdown-divider"></li>
      <li>
        <button class="dropdown-item" data-sheet-order="renumber" type="button">
          <svg class="icon"><use href="/ftl/assets/icons/icons.svg#icon-hash"/></svg>&nbsp;Renumber cues
        </button>
      </li>
      <li>
        <button class="dropdown-item" data-sheet-order="sort" type="button">
          <svg class="icon"><use href="/ftl/assets/icons/icons.svg#icon-sort"/></svg>&nbsp;Sort by cue number
        </button>
      </li>
      <li><hr class="dropdown-divider"></li>
      <li>
        <a class="dropdown-item" href="/api/show/export">
          <svg class="icon"><use href="/ftl/assets/icons/icons.svg#icon-download"/></svg>&nbsp;Export show (.CTP)
        </a>
      </li>
      <li>
        <button class="dropdown-item" data-bs-toggle="modal" data-bs-target="#showModal" type="button">
          <svg class="icon"><use href="/ftl/assets/icons/icons.svg#icon-upload"/></svg>&nbsp;Import show (.CTP)
        </button>
      </li>
      <li><hr class="dropdown-divider"></li>
      <li>
        <button class="dropdown-item" data-bs-toggle="modal" data-bs-target="#logsModal" title="View logs" aria-label="View logs" type="button">
          <svg class="icon"><use href="/ftl/assets/icons/icons.svg#icon-terminal"/></svg>&nbsp;Logs
        </button>
      </li>
      <li>
        <button class="dropdown-item" hx-post="/api/restart" hx-swap="none" hx-confirm="Restart the CuTePi server?" type="button">
          <svg class="icon"><use href="/ftl/assets/icons/icons.svg#icon-refresh"/></svg>&nbsp;Restart
        </button>
      </li>
      <li>
        <button class="dropdown-item" hx-post="/api/shutdown" hx-swap="none" hx-confirm="Shut down the CuTePi server?" type="button">
          <svg class="icon"><use href="/ftl/assets/icons/icons.svg#icon-power"/></svg>&nbsp;Shutdown
        </button>
      </li>
    </ul>
  </div>
</div>

{{ end }}
