{{ define "mediacontrols.html" }}

<div id="esc" hx-trigger="esc" hx-post="/api/esc" hx-swap="none" hidden></div>
<div id="panichard" hx-trigger="panichard" hx-post="/api/panic" hx-swap="none" hidden></div>
<!-- Main menu: the ftl-themes .dropdown as a popover (top layer; the browser
     handles Esc, click-outside and focus return). ui.js closes it after a pick. -->
<button type="button" class="btn btn-secondary btn-icon" id="app-menu-btn" popovertarget="app-menu"
  aria-haspopup="menu" title="Menu" aria-label="Menu">
  <svg class="icon"><use href="/ftl/assets/icons/icons.svg#icon-menu"/></svg>
</button>
<div class="dropdown" popover id="app-menu" role="menu" aria-label="Menu">
  <button class="dropdown-item is-danger" role="menuitem" hx-post="/api/panic" hx-swap="none" hx-confirm="PANIC: cut playback now?" type="button"><span class="row is-items-center is-gap-xs"><svg class="icon"><use href="/ftl/assets/icons/icons.svg#icon-warning"/></svg><span>Panic</span></span></button>
  <button class="dropdown-item" role="menuitem" hx-post="/api/stop" hx-swap="none" type="button"><span class="row is-items-center is-gap-xs"><svg class="icon"><use href="/ftl/assets/icons/icons.svg#icon-stop"/></svg><span>Stop</span></span></button>
  <button class="dropdown-item" role="menuitem" hx-post="/api/fadeOut" hx-swap="none" type="button"><span class="row is-items-center is-gap-xs"><svg class="icon"><use href="/ftl/assets/icons/icons.svg#icon-sun-low"/></svg><span>Fade out</span></span></button>
  <hr class="divider">
  <button class="dropdown-item" role="menuitem" data-sheet-order="renumber" type="button"><span class="row is-items-center is-gap-xs"><svg class="icon"><use href="/ftl/assets/icons/icons.svg#icon-hash"/></svg><span>Renumber cues</span></span></button>
  <button class="dropdown-item" role="menuitem" data-sheet-order="sort" type="button"><span class="row is-items-center is-gap-xs"><svg class="icon"><use href="/ftl/assets/icons/icons.svg#icon-sort"/></svg><span>Sort by cue number</span></span></button>
  <hr class="divider">
  <a class="dropdown-item" role="menuitem" href="/api/show/export"><span class="row is-items-center is-gap-xs"><svg class="icon"><use href="/ftl/assets/icons/icons.svg#icon-download"/></svg><span>Export show (.CTP)</span></span></a>
  <button class="dropdown-item" role="menuitem" data-bs-toggle="modal" data-bs-target="#showModal" type="button"><span class="row is-items-center is-gap-xs"><svg class="icon"><use href="/ftl/assets/icons/icons.svg#icon-upload"/></svg><span>Import show (.CTP)</span></span></button>
  <hr class="divider">
  <button class="dropdown-item" role="menuitem" data-settings-open type="button"><span class="row is-items-center is-gap-xs"><svg class="icon"><use href="/ftl/assets/icons/icons.svg#icon-settings"/></svg><span>Settings</span></span></button>
  <button class="dropdown-item" role="menuitem" data-bs-toggle="modal" data-bs-target="#logsModal" type="button"><span class="row is-items-center is-gap-xs"><svg class="icon"><use href="/ftl/assets/icons/icons.svg#icon-terminal"/></svg><span>Logs</span></span></button>
  <button class="dropdown-item" role="menuitem" hx-post="/api/restart" hx-swap="none" hx-confirm="Restart the CuTePi server?" type="button"><span class="row is-items-center is-gap-xs"><svg class="icon"><use href="/ftl/assets/icons/icons.svg#icon-refresh"/></svg><span>Restart</span></span></button>
  <button class="dropdown-item" role="menuitem" hx-post="/api/shutdown" hx-swap="none" hx-confirm="Shut down the CuTePi server?" type="button"><span class="row is-items-center is-gap-xs"><svg class="icon"><use href="/ftl/assets/icons/icons.svg#icon-power"/></svg><span>Shutdown</span></span></button>
</div>

{{ end }}
