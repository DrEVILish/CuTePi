{{ define "mediacontrols.html" }}

<div id="esc" hx-trigger="esc" hx-post="/api/stop" hx-swap="none" style="display: none;"></div>
<div class="d-flex gap-2">
  <div class="btn-group">
    <button class="btn btn-sm btn-danger dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false" title="Menu" aria-label="Menu"></button>
     <ul class="dropdown-menu dropdown-menu-end">
      <li>
        <button class="dropdown-item" hx-post="/api/panic" hx-swap="none" hx-confirm="PANIC: cut playback now?" type="button">
          <i class="bi bi-exclamation-triangle-fill"></i>&nbsp;Panic
        </button>
      </li>
      <li>
        <button class="dropdown-item" hx-post="/api/stop" hx-swap="none" type="button">
          <i class="bi bi-stop-fill"></i>&nbsp;Stop
        </button>
      </li>
      <li>
        <button class="dropdown-item" hx-post="/api/fadeOut" hx-swap="none" type="button">
          <i class="bi bi-brightness-low-fill"></i>&nbsp;Fade out
        </button>
      </li>
      <li><hr class="dropdown-divider"></li>
      <li>
        <a class="dropdown-item" href="/api/show/export">
          <i class="bi bi-box-arrow-down"></i>&nbsp;Export show (.CTP)
        </a>
      </li>
      <li>
        <button class="dropdown-item" data-bs-toggle="modal" data-bs-target="#showModal" type="button">
          <i class="bi bi-box-arrow-up"></i>&nbsp;Import show (.CTP)
        </button>
      </li>
      <li><hr class="dropdown-divider"></li>
      <li>
        <button class="dropdown-item" data-bs-toggle="modal" data-bs-target="#logsModal" title="View logs" aria-label="View logs" type="button">
          <i class="bi bi-terminal"></i>&nbsp;Logs
        </button>
      </li>
      <li>
        <button class="dropdown-item" hx-post="/api/restart" hx-swap="none" hx-confirm="Restart the CuTePi server?" type="button">
          <i class="bi bi-arrow-clockwise"></i>&nbsp;Restart
        </button>
      </li>
      <li>
        <button class="dropdown-item" hx-post="/api/shutdown" hx-swap="none" hx-confirm="Shut down the CuTePi server?" type="button">
          <i class="bi bi-power"></i>&nbsp;Shutdown
        </button>
      </li>
    </ul>
  </div>
</div>

{{ end }}
