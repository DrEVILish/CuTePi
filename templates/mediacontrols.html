{{ define "mediacontrols.html" }}

<!-- <div hx-get="/api/progress" hx-trigger="every 50ms" hx-swap="innerHTML"> -->
  <!-- 0:00.00/0:00.00  -0:00.00 -->
<!-- </div> -->
<div id="esc" hx-trigger="esc" hx-post="/api/stop" hx-swap="none" style="display: none;"></div>
<!-- <div id="escDbl" hx-trigger="escDbl" hx-post="/api/panic" hx-target="#cuesheet" hx-swap="innerHTML"></div> -->
<div class="d-flex gap-2">
  <button class="btn btn-lg btn-success" hx-post="/api/play" hx-swap="none" title="Play" aria-label="Play">
    <i class="bi bi-play-fill"></i>
  </button>
  <div class="btn-group">
    <button class="btn btn-sm btn-secondary" hx-post="/api/togglePause" hx-swap="none" title="Pause" aria-label="Pause">
      <i class="bi bi-pause-fill"></i>
    </button>
    <button class="btn btn-sm btn-danger" hx-post="/api/stop" hx-swap="none" title="Stop" aria-label="Stop">
      <i class="bi bi-stop-fill"></i>
    </button>
    <button class="btn btn-sm btn-danger" hx-post="/api/panic" hx-swap="none" title="Panic" aria-label="Panic">
      <i class="bi bi-exclamation-triangle-fill"></i>
    </button>
    <button class="btn btn-sm btn-warning" hx-post="/api/fadeOut" hx-swap="none" title="Fade Out" aria-label="Fade Out">
      <i class="bi bi-brightness-low-fill"></i>
    </button>
  </div>

  <div class="btn-group">
    <button id="showTestBtn" class="btn btn-sm btn-danger" hx-post="/api/test" hx-swap="none" title="Show Test" aria-label="Show Test">
      <i class="bi bi-tv-fill"></i>
    </button>
    <button class="btn btn-sm btn-danger dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false" title="Settings" aria-label="Settings"></button>
     <ul class="dropdown-menu dropdown-menu-end">
      <li>
        <button class="dropdown-item" data-test-open type="button">
          <i class="bi bi-person-video2"></i>&nbsp;Tests
        </button>
      </li>
      <li>
        <button class="dropdown-item" data-settings-open type="button">
          <i class="bi bi-gear-fill"></i>&nbsp;Settings
        </button>
      </li>
      <li><hr class="dropdown-divider"></li>
      <li>
        <button class="dropdown-item" hx-post="/api/restart" hx-swap="none" hx-confirm="Restart the CuTePi server?" type="button">
          <i class="bi bi-arrow-clockwise"></i>&nbsp;Restart
        </button>
      </li>
      <li>
        <button class="dropdown-item" hx-post="/api/shutdown" hx-swap="none" hx-confirm="Shut down the CuTePi server?" type="button">
          <i class="bi bi-power"></i>&nbsp;Shutdown
        </button>
      </li>
    </ul>
  </div>
</div>

{{ end }}
